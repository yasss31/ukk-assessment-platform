version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    container_name: ukk-assessment-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=UKK Assessment Platform
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=false
      - SECRET_KEY=${SECRET_KEY:-ukk-production-secret-key-change-this}
      - SUPER_ADMIN_USERNAME=${SUPER_ADMIN_USERNAME:-admin}
      - SUPER_ADMIN_PASSWORD=${SUPER_ADMIN_PASSWORD:-adminukk2026}
      - GOOGLE_SPREADSHEET_ID=${GOOGLE_SPREADSHEET_ID:-1Ri7F8T7YTQdr7F71aslfVpIfYrSva_F0dmtbT5tBJW8}
      - GOOGLE_SERVICE_ACCOUNT_JSON=/app/service_account.json
      - CORS_ORIGINS=http://localhost,http://localhost:80,http://localhost:5173,http://localhost:3000,*
    volumes:
      - ./backend/local_storage:/app/local_storage
      - ./backend/service_account.json:/app/service_account.json:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python worker.py
    container_name: ukk-assessment-worker
    restart: unless-stopped
    environment:
      - APP_NAME=UKK Assessment Platform Worker
      - GOOGLE_SPREADSHEET_ID=${GOOGLE_SPREADSHEET_ID:-1Ri7F8T7YTQdr7F71aslfVpIfYrSva_F0dmtbT5tBJW8}
      - GOOGLE_SERVICE_ACCOUNT_JSON=/app/service_account.json
    volumes:
      - ./backend/local_storage:/app/local_storage
      - ./backend/service_account.json:/app/service_account.json:ro
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'python worker.py' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      - backend

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python scheduler.py
    container_name: ukk-assessment-scheduler
    restart: unless-stopped
    environment:
      - APP_NAME=UKK Auto Play Scheduler
    volumes:
      - ./backend/local_storage:/app/local_storage
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'python scheduler.py' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ukk-assessment-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: ukk-assessment-tunnel
    restart: unless-stopped
    network_mode: host
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    environment:
      - CLOUDFLARE_TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
